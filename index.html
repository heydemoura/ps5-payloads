<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heydemoura's PS5 Payloads</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; padding: 16px; }
.container { max-width: 640px; margin: 0 auto; padding: 32px 0; }
h1 { font-size: 1.5rem; margin-bottom: 8px; }
.subtitle { color: var(--text-muted); margin-bottom: 24px; }
.source-url { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
.source-url label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
.source-url code { display: block; font-size: 0.95rem; color: var(--accent); word-break: break-all; cursor: pointer; }
.source-url code:hover { text-decoration: underline; }
.source-url .hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }
.payloads { display: flex; flex-direction: column; gap: 12px; }
.payload { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.payload h2 { font-size: 1.1rem; margin-bottom: 4px; }
.payload .meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
.payload .meta span { margin-right: 12px; }
.payload .desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; }
.badge { display: inline-block; background: #1f6feb33; color: var(--accent); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; }
.badge.green { background: #23863633; color: var(--green); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.loading { color: var(--text-muted); text-align: center; padding: 32px; }
.error { color: #f85149; text-align: center; padding: 32px; }
</style>
</head>
<body>
<div class="container">
  <h1>heydemoura's PS5 Payloads</h1>
  <p class="subtitle">Custom payload repository for <a href="https://github.com/itsPLK/ps5-payload-manager">PS5 Payload Manager</a></p>

  <div class="source-url">
    <label>Add this source in Settings &rarr; Manage Sources:</label>
    <code id="url" onclick="copyUrl()">https://heydemoura.github.io/ps5-payloads/payloads.json</code>
    <div class="hint" id="copy-hint">Click to copy</div>
  </div>

  <div class="payloads" id="payloads">
    <div class="loading">Loading payloads&hellip;</div>
  </div>
</div>
<script>
function copyUrl() {
  var url = document.getElementById('url').textContent;
  navigator.clipboard.writeText(url).then(function() {
    document.getElementById('copy-hint').textContent = 'Copied!';
    setTimeout(function() { document.getElementById('copy-hint').textContent = 'Click to copy'; }, 2000);
  });
}
fetch('payloads.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var container = document.getElementById('payloads');
    container.innerHTML = '';
    data.payloads.forEach(function(p) {
      var div = document.createElement('div');
      div.className = 'payload';
      div.innerHTML =
        '<h2>' + p.name + '</h2>' +
        '<div class="meta">' +
          '<span class="badge green">' + p.version + '</span> ' +
          '<span>' + p.category + '</span>' +
          '<span>' + p.last_update + '</span>' +
        '</div>' +
        '<div class="desc">' + p.description + '</div>' +
        '<a href="' + p.source + '">Source</a>';
      container.appendChild(div);
    });
  })
  .catch(function() {
    document.getElementById('payloads').innerHTML = '<div class="error">Failed to load payloads</div>';
  });
</script>
</body>
</html>
